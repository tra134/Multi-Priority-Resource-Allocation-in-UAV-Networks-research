[project]
name = "uavmec"
version = "0.1.0"
description = "Reproduction of Lin et al. 2025 (multi-UAV MEC, MADDPG-NOMA) and a multi-priority extension with ensemble critic and LLM arbiter"
requires-python = ">=3.10"
authors = [{ name = "traphan" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
    "gymnasium>=0.29",
    "torch>=2.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
