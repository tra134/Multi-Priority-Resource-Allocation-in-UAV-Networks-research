[project]
name = "uavrl"
version = "0.1.0"
description = "UAV Multi-Priority Resource Allocation with SAC + Ensemble Critic + Async LLM Arbiter"
requires-python = ">=3.10"
authors = [{ name = "traphan" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "gymnasium>=0.29",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
    "tensorboard>=2.12",
    "requests>=2.28",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
