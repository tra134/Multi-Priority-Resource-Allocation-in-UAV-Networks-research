# Training hyperparameters for the Lin et al. 2025 reproduction (docs/lin2025_spec.md Section 10).
# A-23 values must be approved by the HUMAN before a real training run.
# Tags: P = paper location, A-23 = proposed assumption, pending HUMAN approval.

episodes: 10000      # A-23 (proposed, pending HUMAN approval); Fig. 4 axis
eval_every: 500      # A-23 (proposed, pending HUMAN approval)
eval_episodes: 20    # A-23 (proposed, pending HUMAN approval); validation seeds 2000.. (A-36)
ckpt_every: 500      # A-23 (proposed, pending HUMAN approval)

maddpg:
  batch: 320               # P: Section 6.1 hyperparameters
  actor_lr: 3.0e-4         # P: Section 6.1
  critic_lr: 5.0e-5        # P: Section 6.1
  buffer: 131072           # P: Section 6.1 (2^17)
  gamma: 0.9               # P: Section 6.1
  tau_soft: 0.01           # A-23 (proposed, pending HUMAN approval)
  warmup: 1000             # A-23 (proposed, pending HUMAN approval); transitions before updates
  gumbel_tau: 1.0          # A-23 (proposed, pending HUMAN approval)
  noise_sigma_start: 0.1   # A-23 (proposed, pending HUMAN approval)
  noise_sigma_end: 0.01    # A-23 (proposed, pending HUMAN approval)
  noise_decay_steps: 50000 # A-23 (proposed, pending HUMAN approval); half of 10000 episodes x 10 steps
  actor_hidden: 128        # P: Fig. 3 (ReLU6)
  critic_hidden: [64, 32]  # P: Fig. 3

mappo:
  actor_lr: 3.0e-4         # P: Section 6.1 (same as MADDPG, A-23)
  critic_lr: 5.0e-5        # P: Section 6.1 (same as MADDPG, A-23)
  gamma: 0.9               # P: Section 6.1
  gae_lambda: 0.95         # A-23 (proposed, pending HUMAN approval)
  clip: 0.2                # A-23 (proposed, pending HUMAN approval)
  epochs: 10               # A-23 (proposed, pending HUMAN approval)
  minibatch: 320           # A-23 (proposed, pending HUMAN approval); P batch 320 reused
  rollout_episodes: 32     # A-23 (proposed, pending HUMAN approval)
  actor_hidden: 128        # P: Fig. 3 (ReLU6)
  critic_hidden: [64, 32]  # P: Fig. 3
  ent_coef: 0.01           # A-23 (proposed, pending HUMAN approval)
