# LLM arbiter configuration (Phase 8)
#
# Default provider: Groq (OpenAI-compatible endpoint).
# The API key is NEVER stored here. Put it in the local .env file:
#
#   LLM_BASE_URL=https://api.groq.com/openai/v1
#   LLM_API_KEY=gsk_...
#   LLM_MODEL=qwen/qwen3.8-27b
#
# Environment variables override the values below.  See .env.example.
# Groq deprecated llama-3.3-70b-versatile on 2026-08-16.  Tested options on
# Groq (2026-11): qwen/qwen3.8-27b (default: no reasoning tokens, ~1.1 s
# median, 100% valid on the Phase 8 smoke test) and openai/gpt-oss-120b
# (reasoning model; use reasoning_effort: low).
# max_tokens is 512 (not 200) to leave room for GPT-OSS reasoning tokens
# before the JSON object; the JSON itself is ~70 tokens.

llm:
  provider: groq
  base_url: https://api.groq.com/openai/v1
  api_key: null          # from env LLM_API_KEY (or .env)
  model: qwen/qwen3.8-27b      # from env LLM_MODEL
  temperature: 0.0
  max_tokens: 512
  response_format_json: true   # falls back automatically if unsupported
  reasoning_effort: low        # only sent for GPT-OSS models; ignored for Qwen
  retry_max: 1
  rate_limit_retries: 3        # extra retries for HTTP 429, uses Retry-After
  rate_limit_max_sleep_s: 30
  timeout_s: 30

prompt:
  few_shot_examples: 3
  round_sigfigs: 2              # cache key rounding

cache:
  enabled: true
  dir: results/llm_cache

failure_injection:
  p_invalid_json: 0.0
  p_out_of_range: 0.0
  p_wrong_diagnosis: 0.0
  p_timeout: 0.0
