# LLM arbiter configuration (Phase 8)
#
# Default provider: Groq (OpenAI-compatible endpoint).
# The API key is NEVER stored here. Put it in the local .env file:
#
#   LLM_BASE_URL=https://api.groq.com/openai/v1
#   LLM_API_KEY=gsk_...
#   LLM_MODEL=openai/gpt-oss-120b
#
# Environment variables override the values below.  See .env.example.
# Groq deprecated llama-3.3-70b-versatile on 2026-08-16; gpt-oss-120b is the
# recommended replacement, with qwen/qwen3.6-27b as a smaller/faster option.
# max_tokens is 512 (not 200) to leave room for GPT-OSS reasoning tokens
# before the JSON object; the JSON itself is ~70 tokens.

llm:
  provider: groq
  base_url: https://api.groq.com/openai/v1
  api_key: null          # from env LLM_API_KEY (or .env)
  model: openai/gpt-oss-120b   # from env LLM_MODEL
  temperature: 0.0
  max_tokens: 512
  response_format_json: true   # falls back automatically if unsupported
  retry_max: 1
  timeout_s: 30

prompt:
  few_shot_examples: 3
  round_sigfigs: 2              # cache key rounding

cache:
  enabled: true
  dir: results/llm_cache

failure_injection:
  p_invalid_json: 0.0
  p_out_of_range: 0.0
  p_wrong_diagnosis: 0.0
  p_timeout: 0.0
