# calib-v2: per-checkpoint trigger and shield values (read by scripts/run_grid.py).
# Validation seeds only; no test seeds, no ground-truth labels.
version: calib-v2
env_version: env-v2
frozen: true  # frozen 2026-11-13 under the HUMAN's calib-v2 approval (TE-071, TE-082)
protocol: [TE-041, TE-073]  # theta_queue rule (TE-041); M8/M9 call-rate method (TE-073)
note: >-
  m8_random_rate and m9_K come from M12's call rate with MockLLM, an approximation of
  the real-LLM rate (the mask a real LLM installs can change later triggers a little).
  Seed 0 keeps the TE-048 values (RQ3 MockLLM run); seeds 1-4 were measured with the TE-073 protocol (TE-077, TE-078).
checkpoints:
  sac_seed0_N10_mask:
    tau_unc: 0.3613982063531872  # raw p99, val_seed(0..49), 50 slots skipped
    theta_queue: 35000.0  # TE-041 rule on val_seed(1100..1109)
    m8_random_rate: 0.00635  # TE-048: 12.7 calls / 2000 slots
    m9_K: 157  # TE-048: round(2000 / 12.7)
    status: complete
  sac_seed1_N10_mask:
